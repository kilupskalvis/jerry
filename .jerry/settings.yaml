policy:
  deny:
    - "bash(rm -rf:*)"
    - "bash(chmod 777:*)"
    - "bash(curl * | sh:*)"
    - "bash(wget * | sh:*)"
    - "read(.env)"
    - "read(**/*.pem)"
    - "read(**/*.key)"
    - "read(**/*credentials*)"
    - "write(.env)"
    - "write(**/*.pem)"
    - "write(.jerry/settings.yaml)"
  budget:
    max_cost_per_run: 10.00
