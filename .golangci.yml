version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gocritic
    - nilerr
    - errorlint
    - prealloc
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - prealloc
      - path: internal/output/printer\.go
        linters:
          - errcheck
    presets:
      - std-error-handling
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain
        - unnamedResult
    errcheck:
      check-blank: false
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kilupskalvis/motif
