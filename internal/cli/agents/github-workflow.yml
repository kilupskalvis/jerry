# Motif Feature Generation — triggered by issues with 'motif' label.
# Generated by: motif init --ci github

name: Motif Feature Generation
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      intent:
        description: 'What to build'
        required: true

jobs:
  generate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'motif')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Motif
        run: |
          VERSION="latest"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
          if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
          curl -sL "https://github.com/motif-protocol/motif/releases/download/${VERSION}/motif-${OS}-${ARCH}" -o /usr/local/bin/motif
          chmod +x /usr/local/bin/motif

      - name: Run Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          INTENT="${{ github.event.inputs.intent || github.event.issue.title }}"
          motif run feature --intent "$INTENT"

      - name: Create PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.inputs.intent }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
        run: |
          SAFE_TITLE=$(echo "$ISSUE_TITLE" | tr ' ' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | head -c 50)
          BRANCH="motif/${SAFE_TITLE}-${ISSUE_NUMBER}"
          git config user.name "Motif Bot"
          git config user.email "motif@noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated."
            exit 0
          fi
          git commit -m "feat: ${ISSUE_TITLE}"
          git push origin "$BRANCH"
          gh pr create \
            --title "$ISSUE_TITLE" \
            --body "Generated by Motif from #${ISSUE_NUMBER}" \
            --base main
