# Generated by jerry init — edit triggers and secrets as needed.
name: Jerry
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      intent:
        description: 'What to build'
        required: true

jobs:
  generate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'jerry')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: jerry-protocol/runner@v1
        with:
          pipeline: feature
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
