# Jerry Feature Generation for GitLab CI.
# Generated by: jerry init --ci gitlab
#
# Add this to your .gitlab-ci.yml or include it as a separate file.
# Trigger via pipeline API:
#   curl --request POST --form "token=$CI_JOB_TOKEN" --form "ref=main" \
#     --form "variables[JERRY_INTENT]=Add notification preferences" \
#     "https://gitlab.com/api/v4/projects/$PROJECT_ID/trigger/pipeline"

jerry-feature:
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
  before_script:
    - apk add --no-cache git curl bash
    - |
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      ARCH=$(uname -m)
      if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
      if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
      curl -sL "https://github.com/jerry-protocol/jerry/releases/download/latest/jerry-${OS}-${ARCH}" -o /usr/local/bin/jerry
      chmod +x /usr/local/bin/jerry
  script:
    - jerry validate --pipeline feature
    - jerry run feature --intent "$JERRY_INTENT"
    - |
      git config user.name "Jerry Bot"
      git config user.email "jerry@noreply.gitlab.com"
      BRANCH="jerry/feature-$(date +%s)"
      git checkout -b "$BRANCH"
      git add -A
      if git diff --cached --quiet; then
        echo "No changes generated."
        exit 0
      fi
      git commit -m "feat: $JERRY_INTENT"
      git push origin "$BRANCH"
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
        --data "source_branch=$BRANCH&target_branch=main&title=Jerry: $JERRY_INTENT"
