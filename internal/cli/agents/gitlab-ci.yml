# Motif Feature Generation for GitLab CI.
# Generated by: motif init --ci gitlab
#
# Add this to your .gitlab-ci.yml or include it as a separate file.
# Trigger via pipeline API:
#   curl --request POST --form "token=$CI_JOB_TOKEN" --form "ref=main" \
#     --form "variables[MOTIF_INTENT]=Add notification preferences" \
#     "https://gitlab.com/api/v4/projects/$PROJECT_ID/trigger/pipeline"

motif-feature:
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
  before_script:
    - apk add --no-cache git curl bash
    - |
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      ARCH=$(uname -m)
      if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
      if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
      curl -sL "https://github.com/motif-protocol/motif/releases/download/latest/motif-${OS}-${ARCH}" -o /usr/local/bin/motif
      chmod +x /usr/local/bin/motif
  script:
    - motif validate --pipeline feature
    - motif run feature --intent "$MOTIF_INTENT"
    - |
      git config user.name "Motif Bot"
      git config user.email "motif@noreply.gitlab.com"
      BRANCH="motif/feature-$(date +%s)"
      git checkout -b "$BRANCH"
      git add -A
      if git diff --cached --quiet; then
        echo "No changes generated."
        exit 0
      fi
      git commit -m "feat: $MOTIF_INTENT"
      git push origin "$BRANCH"
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
        --data "source_branch=$BRANCH&target_branch=main&title=Motif: $MOTIF_INTENT"
