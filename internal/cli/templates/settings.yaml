# .jerry/settings.yaml — org policy applied to every workflow in this repo.
# deny rules are non-overridable: workflows cannot relax them. Patterns use
# the noun(selector) grammar, e.g. bash(rm -rf:*), read(.env), write(**/*.pem).
policy:
  deny:
    - "bash(rm -rf:*)"
    - "bash(chmod 777:*)"
    - "bash(curl * | sh:*)"
    - "read(.env)"
    - "read(**/*.pem)"
    - "read(**/*.key)"
    - "write(.env)"
    - "write(.jerry/settings.yaml)"
  budget:
    max_cost_per_run: 10.00
