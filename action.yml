name: 'Motif Pipeline Runner'
description: 'Run a Motif code generation pipeline. Handles checkout, install, execution, and PR creation.'
inputs:
  pipeline:
    description: 'Pipeline name to run (e.g., feature)'
    required: true
  intent:
    description: 'Override the trigger intent'
    required: false
  publish:
    description: 'What to do after success (pull_request, none)'
    required: false
    default: 'pull_request'
  motif-version:
    description: 'Motif CLI version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Install Motif
      shell: bash
      run: |
        VERSION="${{ inputs.motif-version }}"
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
        if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
        curl -sL "https://github.com/motif-protocol/motif/releases/download/${VERSION}/motif-${OS}-${ARCH}" -o /usr/local/bin/motif
        chmod +x /usr/local/bin/motif

    - name: Run Pipeline
      shell: bash
      run: |
        INTENT="${{ inputs.intent }}"
        if [ -n "$INTENT" ]; then
          motif run "${{ inputs.pipeline }}" "$INTENT"
        else
          motif run "${{ inputs.pipeline }}" --trigger-file "$GITHUB_EVENT_PATH"
        fi

    - name: Publish Changes
      if: success() && inputs.publish == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes generated."
          exit 0
        fi

        ISSUE_TITLE="${{ github.event.issue.title || github.event.inputs.intent || inputs.intent || 'Motif generated changes' }}"
        ISSUE_NUMBER="${{ github.event.issue.number || '0' }}"

        SAFE_TITLE=$(echo "$ISSUE_TITLE" | tr ' ' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | head -c 50)
        BRANCH="motif/${SAFE_TITLE}-${ISSUE_NUMBER}"

        git config user.name "Motif Bot"
        git config user.email "motif@noreply.github.com"
        git checkout -b "$BRANCH"
        git add -A
        git commit -m "feat: ${ISSUE_TITLE}"
        git push origin "$BRANCH"

        BODY="Generated by [Motif](https://github.com/motif-protocol/motif)"
        if [ "$ISSUE_NUMBER" != "0" ]; then
          BODY="Generated by [Motif](https://github.com/motif-protocol/motif) from #${ISSUE_NUMBER}"
        fi

        gh pr create \
          --title "$ISSUE_TITLE" \
          --body "$BODY" \
          --base "${{ github.event.repository.default_branch || 'main' }}"
