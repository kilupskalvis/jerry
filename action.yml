name: 'Motif Pipeline Runner'
description: 'Run a Motif code generation pipeline'
inputs:
  pipeline:
    description: 'Pipeline name to run'
    required: true
  intent:
    description: 'Trigger intent description'
    required: false
  model:
    description: 'Override the default model'
    required: false
  motif-version:
    description: 'Motif CLI version to install'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - name: Install Motif
      shell: bash
      run: |
        VERSION="${{ inputs.motif-version }}"
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
        if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
        curl -sL "https://github.com/motif-protocol/motif/releases/download/${VERSION}/motif-${OS}-${ARCH}" -o /usr/local/bin/motif
        chmod +x /usr/local/bin/motif

    - name: Validate Pipeline
      shell: bash
      run: motif validate --pipeline "${{ inputs.pipeline }}"

    - name: Run Pipeline
      shell: bash
      run: |
        ARGS=""
        if [ -n "${{ inputs.intent }}" ]; then
          ARGS="--intent \"${{ inputs.intent }}\""
        fi
        motif run "${{ inputs.pipeline }}" $ARGS
