name: Jerry Feature

on:
  repository_dispatch:
    types: [jerry-ticket]

jobs:
  feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Jerry
        run: go build -o /usr/local/bin/jerry ./cmd/jerry

      - name: Configure git
        run: |
          git config user.name "jerry[bot]"
          git config user.email "jerry[bot]@users.noreply.github.com"

      - name: Run feature workflow
        run: jerry run feature --trigger-file "$GITHUB_EVENT_PATH" --verbose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
