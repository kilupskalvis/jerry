on:
  repository_dispatch:
    types: [jerry-ticket]
jobs:
  feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Jerry
        run: curl -sSL https://jerry.dev/install.sh | sh -s -- --version vdev
      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent@0.73.1
      - name: Drift check
        run: jerry generate --check
      - name: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jerry exec feature/plan
      - name: implement
        timeout-minutes: 16
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jerry exec feature/implement
      - name: test
        timeout-minutes: 6
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jerry exec feature/test
      - name: open-pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jerry exec feature/open-pr
